# MattoniChat (LibreChat) custom configuration
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
#
# Most Railway env vars (APP_TITLE, CUSTOM_FOOTER, HELP_AND_FAQ_URL, ENDPOINTS,
# OPENAI_MODELS, GOOGLE_MODELS, SEARCH, CHECK_BALANCE, etc.) are read directly
# from .env and do NOT need to be duplicated here. This file only holds settings
# that have no .env equivalent (e.g. endpoints.agents.recursionLimit) or that
# benefit from being explicit (e.g. wiring the web search provider keys).

version: 1.3.13

cache: true

interface:
  customWelcome: 'Welcome to MChat!'
  fileSearch: true
  modelSelect: true
  parameters: true
  presets: true
  prompts:
    use: true
    create: true
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true

# Wires up the search provider (Serper), scraper (Firecrawl) and reranker (Jina)
# keys already present in the Railway env (SEARCH=true enables the feature).
# Providers/scraper/reranker are set explicitly since leaving them unset makes
# LibreChat try every credentialed service in the category.
webSearch:
  serperApiKey: '${SERPER_API_KEY}'
  searchProvider: serper
  firecrawlApiKey: '${FIRECRAWL_API_KEY}'
  scraperProvider: firecrawl
  jinaApiKey: '${JINA_API_KEY}'
  rerankerType: jina

endpoints:
  agents:
    # No .env equivalent for this — value carried over from the Railway
    # `recursionLimit=1000` variable, which otherwise does nothing on its own.
    recursionLimit: 1000
    maxRecursionLimit: 1000

# Tosca Cloud (Tricentis) MCP server, native streamable-http + OAuth — no
# mcp-remote/npx bridge needed, since LibreChat itself speaks OAuth for
# remote MCP servers. Path assumes the "default" workspace — swap "default"
# for a workspace ID if Mattoni uses a named workspace instead.
#
# This replaces an earlier mcp-remote/stdio version of this entry. That
# approach ran mcp-remote as a subprocess that opens ITS OWN local browser
# flow against 127.0.0.1:<port> — fine on a laptop, unusable on Railway
# (headless container, no browser, that port unreachable from outside it).
#
# The native path below has no such problem: `requiresOAuth` routes this
# through LibreChat's per-user OAuth handling (packages/api/src/mcp/utils.ts),
# whose redirect_uri defaults to LibreChat's OWN public route —
# /api/mcp/ToscaCloudMcpServer/oauth/callback on whatever domain LibreChat is
# served from (see api/server/routes/mcp.js: oauth/initiate + oauth/callback).
# A user just clicks "Connect" on this server in the UI, logs into Okta like
# any other SSO prompt, and is redirected straight back into the app — no
# CLI, no tunnel, and each person authenticates with their own identity
# (this is intentionally per-user, not a single shared service account).
mcpServers:
  ToscaCloudMcpServer:
    type: streamable-http
    url: https://mattoni-1873-a-s-cloudalm.my-sap.tricentis.com/default/_mcp/api/mcp
    requiresOAuth: true
    oauth:
      client_id: MCPServer
      scope: tta
    timeout: 120000
    
  rozbite-nepouziva-leaflet:
      type: streamable-http
      url: https://leaflet-mcp.livelypebble-298eba33.swedencentral.azurecontainerapps.io/mcp
      headers:
        Authorization: "Bearer 6e234a720bc4227c1e0431802be6f3c82fbc1786d00d6da0"
